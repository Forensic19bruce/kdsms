const Docs = {
  head(title, numberLine) {
    const st = D.db.settings; const logo = st.logo ? `<img src="${esc(st.logo)}" alt="">` : LOGO_SVG;
    const bits = [st.location, st.phone ? 'Tel: ' + Phone.display(st.phone) : '', st.email, st.regNo ? 'Reg. no: ' + st.regNo : '', st.taxPin ? 'Tax PIN: ' + st.taxPin : ''].filter(Boolean);
    return `<div class="doc-head"><div class="doc-brand">${logo}<div><b style="font-size:1.1rem">${esc(st.businessName)}</b>${bits.map(b => `<div class="small" style="color:#56657A">${esc(b)}</div>`).join('')}</div></div><div><div class="doc-title">${esc(title)}</div><div class="right small" style="color:#56657A">${numberLine}</div></div></div>`;
  },
  linesTable(lines) { return `<div class="table-wrap"><table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>${lines.map(l => `<tr><td>${esc(l.name)}</td><td class="r num">${l.qty}</td><td class="r num">${esc(money(l.price))}</td><td class="r num">${esc(money(l.qty * l.price))}</td></tr>`).join('')}</tbody></table></div>`; },
  totals(rows) { return `<div class="totals">${rows.map(r => `<div class="${r[2] || ''}"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}</div>`; },
  invoice(o) {
    const st = D.db.settings, inv = D.issueInvoice(o.id), c = D.customer(o.customerId) || { name: '(deleted)', phone: '' };
    const paidRows = D.paymentsOfOrder(o.id).filter(p => p.verified && !p.voided).sort((a, b) => a.datetime.localeCompare(b.datetime));
    const bal = D.balance(o), paid = D.paid(o.id), cancelled = o.status === 'Cancelled';
    const stamp = D.chargeable(o) > 0 && bal <= 0 ? '<div class="stamp">PAID</div>' : (D.isPayOverdue(o) ? '<div class="stamp due">OVERDUE</div>' : '');
    const tot = [['Subtotal', money(D.subtotal(o))]]; if (o.discount) tot.push(['Discount', '- ' + money(o.discount)]);
    if (cancelled) tot.push(['Order cancelled: fee payable', money(o.cancelFee || 0)]); else tot.push(['Total', money(D.agreed(o))]);
    tot.push(['Paid to date (confirmed)', money(paid)]); tot.push([bal < 0 ? 'Credit / refund due' : 'Balance due', money(Math.abs(bal)), 'big']);
    return `<div class="doc">${this.head('INVOICE', `No. <b>${esc(inv.number)}</b>`)}
    <div class="meta"><div><h4>Bill to</h4><b>${esc(c.name)}</b><div>${esc(Phone.display(c.phone))}</div>${c.email ? `<div>${esc(c.email)}</div>` : ''}</div><div><h4>Invoice details</h4><div>Issued: ${esc(fmtDate(inv.issuedDate))}</div><div>Due: <b>${esc(fmtDate(inv.dueDate))}</b></div><div>Order: ${esc(o.number)} (${esc(fmtDate(o.orderDate))})</div></div></div>
    ${stamp}${this.linesTable(o.lines)}${this.totals(tot)}
    ${paidRows.length ? `<div><h4 style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#56657A;margin-bottom:4px">Payments received</h4><div class="table-wrap"><table><thead><tr><th>Date</th><th>Method</th><th>Reference</th><th class="r">Amount</th></tr></thead><tbody>${paidRows.map(p => `<tr><td>${esc(fmtDate(p.datetime.slice(0, 10)))}</td><td>${esc(p.method)}</td><td>${esc(p.reference || '—')}</td><td class="r num">${p.kind === 'refund' ? '-' : ''}${esc(money(p.amount))}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <div class="small"><b>Payment terms:</b> ${esc(st.paymentTerms)}${st.paymentInstructions ? `<br><b>How to pay:</b> ${esc(st.paymentInstructions)}` : ''}</div>
    <div class="doc-foot">Only payments confirmed by ${esc(st.businessName)} are shown. Prepared on ${esc(fmtDate(todayStr()))}. Thank you for your business.</div></div>`;
  },
  receipt(p) {
    const st = D.db.settings, o = D.order(p.orderId), c = D.customer(p.customerId) || { name: '(deleted)', phone: '' };
    const after = D.balanceAfter(p);
    return `<div class="doc">${this.head('RECEIPT', `No. <b>${esc(p.receiptNo)}</b>`)}<div class="stamp">RECEIVED</div>
    <div class="meta"><div><h4>Received from</h4><b>${esc(c.name)}</b><div>${esc(Phone.display(c.phone))}</div></div><div><h4>Payment details</h4><div>Date: ${esc(fmtDateTime(p.datetime))}</div><div>Method: ${esc(p.method)}</div>${p.reference ? `<div>Reference: <span class="mono">${esc(p.reference)}</span></div>` : ''}<div>Transaction: <span class="mono">${esc(p.id)}</span></div></div></div>
    <div class="table-wrap"><table><tbody><tr><td>For order</td><td>${o ? esc(o.number + ': ' + o.lines.map(l => l.name).join(', ')) : '—'}</td></tr><tr><td>Amount received</td><td><b style="font-size:1.2rem">${esc(money(p.amount))}</b></td></tr><tr><td>Balance remaining on order after this payment</td><td><b>${esc(money(Math.max(0, after)))}</b>${after < 0 ? ` (overpaid by ${esc(money(-after))})` : ''}</td></tr></tbody></table></div>
    <div class="doc-foot">Confirmed received by ${esc(st.ownerName || st.businessName)}${p.verifiedAt ? ' on ' + esc(fmtDateTime(p.verifiedAt)) : ''}. This receipt is only valid for money actually received.</div></div>`;
  },
  quotation(q) {
    const st = D.db.settings, c = D.customer(q.customerId) || { name: '(deleted)', phone: '' }, eff = D.effectiveQuoteStatus(q);
    const tot = [['Subtotal', money(D.quoteSubtotal(q))]]; if (q.discount) tot.push(['Discount', '- ' + money(q.discount)]); tot.push(['Total', money(D.quoteTotal(q)), 'big']);
    return `<div class="doc">${this.head('QUOTATION', `No. <b>${esc(q.number)}</b>`)}${eff === 'Expired' ? '<div class="stamp due">EXPIRED</div>' : ''}
    <div class="meta"><div><h4>Prepared for</h4><b>${esc(c.name)}</b><div>${esc(Phone.display(c.phone))}</div>${c.email ? `<div>${esc(c.email)}</div>` : ''}</div><div><h4>Quotation details</h4><div>Date: ${esc(fmtDate(q.date))}</div><div>Valid until: <b>${esc(fmtDate(q.validUntil))}</b></div>${q.delivery ? `<div>Delivery: ${esc(q.delivery)}</div>` : ''}</div></div>
    ${this.linesTable(q.lines)}${this.totals(tot)}
    <div class="small"><b>Terms:</b> ${esc(q.terms || st.paymentTerms)}${st.paymentInstructions ? `<br><b>How to pay:</b> ${esc(st.paymentInstructions)}` : ''}</div>
    <div class="doc-foot">This is a price estimate, not an invoice. To accept, reply to confirm and pay the deposit, if required. Prices are in Kenyan Shillings (KSh).</div></div>`;
  }
};

const orderForm = (o = {}, forCustomer) => {
  const isNew = !o.id; const T = todayStr();
  const statusOpts = (o.status === 'Cancelled' ? STATUSES : STATUSES.filter(s => s !== 'Cancelled'));
  return `<form id="mform" class="form" data-form="order" data-id="${esc(o.id || '')}" novalidate>${F.top()}
  ${D.db.customers.length ? '' : '<div class="notice warn">Add a customer first (Customers page), then come back to create the order.</div>'}
  <div class="row2">${F.select('customerId', 'Customer', F.customerOptions(), o.customerId || forCustomer || '', { blank: 'Choose a customer', req: 1 })}${F.select('status', 'Status', statusOpts, o.status || 'New enquiry', { req: 1 })}</div>
  ${F.lineEditor(o.lines)}
  <div class="row2">${F.text('discount', 'Discount (KSh)', o.discount || 0, { type: 'number', attrs: 'min="0" step="1"' })}${F.text('depositRequired', 'Deposit required (KSh, optional)', o.depositRequired || 0, { type: 'number', attrs: 'min="0" step="1"', hint: 'Used in deposit reminders.' })}</div>
  <div data-totals class="totals"></div>
  ${F.area('description', 'Order description and agreed scope', o.description, { req: 1, rows: 3, ph: 'What exactly will be delivered? Number of pages, revisions included, format...' })}
  <div class="row2">${F.text('orderDate', 'Order date', o.orderDate || T, { req: 1, type: 'date' })}${F.text('deadline', 'Deadline', o.deadline || addDays(T, 3), { req: 1, type: 'date' })}</div>
  ${F.select('deliveryMethod', 'Delivery method', DELIVERY_METHODS, o.deliveryMethod || DELIVERY_METHODS[0])}
  ${F.area('notes', 'Internal notes (not shown to the customer)', o.notes, { rows: 2 })}
  ${o.id ? `<p class="muted small">Order number ${esc(o.number)} is fixed and cannot be edited. Payments are recorded separately so your money records stay accurate.</p>` : ''}</form>`;
};
const openOrderModal = (o, forCustomer) => { const d = UI.modal({ title: o && o.id ? `Edit order ${o.number}` : 'New order', wide: true, body: orderForm(o || {}, forCustomer), footer: '<button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn btn-primary" type="submit" form="mform">Save order</button>' }); UI.updateTotals(d.querySelector('form')); };
Actions.newOrder = () => openOrderModal(null);
Actions.newOrderFor = ds => openOrderModal(null, ds.id);
Actions.editOrder = ds => { const o = D.order(ds.id); if (o) openOrderModal(o); };
Forms.order = form => {
  const v = UI.readForm(form); v.lines = UI.readLines(form); const id = form.dataset.id || null;
  const r = D.upsertOrder(v, id); if (!r.ok) return UI.showErrors(form, r.errors);
  UI.closeModal(); const o = r.record;
  if (id && D.paid(o.id) > D.chargeable(o) && o.status !== 'Cancelled') UI.toast(`Saved. This order is now overpaid by ${money(D.paid(o.id) - D.chargeable(o))}. Record a refund if you return money.`, 'err');
  else UI.toast(id ? 'Order updated.' : `Order ${o.number} created.`, 'ok');
  if (id && D.invoiceFor(o.id)) UI.toast('The invoice for this order now shows the updated amounts.');
  if (UI.current.name === 'order') UI.refresh(); else UI.go('order/' + o.id);
};

/* ---------- orders list ---------- */
Pages.orders = {
  title: 'Orders',
  render() {
    const f = UI.f.orders;
    return `<div class="toolbar"><input class="grow" type="text" placeholder="Search order no., customer, service or description" value="${esc(f.q)}" data-filter="orders.q" aria-label="Search orders"><select data-filter="orders.status" aria-label="Filter by status" style="width:auto"><option value="">All statuses</option>${F.opts(STATUSES, f.status)}</select><select data-filter="orders.due" aria-label="Filter by deadline" style="width:auto">${F.opts([['', 'Any deadline'], ['overdue', 'Overdue'], ['today', 'Due today'], ['week', 'Due in 7 days'], ['later', 'Due later']], f.due)}</select><button class="btn btn-primary" data-act="newOrder">+ New order</button></div><div id="list">${this.list()}</div>`;
  },
  list() {
    const f = UI.f.orders, T = todayStr(), q = f.q.trim().toLowerCase();
    const match = o => {
      if (f.status && o.status !== f.status) return false;
      if (q && !(o.number.toLowerCase().includes(q) || D.customerName(o.customerId).toLowerCase().includes(q) || o.description.toLowerCase().includes(q) || o.lines.some(l => l.name.toLowerCase().includes(q)))) return false;
      const open = !['Completed', 'Cancelled'].includes(o.status);
      if (f.due === 'overdue') return D.isOverdue(o);
      if (f.due === 'today') return open && o.deadline === T;
      if (f.due === 'week') return open && o.deadline >= T && o.deadline <= addDays(T, 7);
      if (f.due === 'later') return open && o.deadline > addDays(T, 7);
      return true;
    };
    const rows = D.db.orders.filter(match).sort((a, b) => { const ao = !['Completed', 'Cancelled'].includes(a.status), bo = !['Completed', 'Cancelled'].includes(b.status); if (ao !== bo) return ao ? -1 : 1; return ao ? a.deadline.localeCompare(b.deadline) : b.orderDate.localeCompare(a.orderDate); });
    return UI.table(['Order', 'Customer', 'Services', 'Deadline', 'Status', { t: 'Total', r: 1 }, { t: 'Paid', r: 1 }, { t: 'Balance', r: 1 }, 'Payment'], rows.map(o => `<tr><td>${ordLink(o)}</td><td>${custLink(o.customerId)}</td><td>${esc(o.lines.map(l => (l.qty > 1 ? l.qty + ' x ' : '') + l.name).join(', '))}</td><td>${dueCell(o)}</td><td>${UI.statusBadge(o.status)}</td><td class="r num">${esc(money(D.chargeable(o)))}</td><td class="r num">${esc(money(D.paid(o.id)))}</td><td class="r num">${D.outstanding(o) > 0 ? `<b style="color:var(--red)">${esc(money(D.outstanding(o)))}</b>` : esc(money(0))}</td><td>${UI.payBadge(D.invoiceStatus(o))}</td></tr>`), { empty: D.db.orders.length ? UI.empty('No orders match', 'Change the search or filters.') : UI.empty('No orders yet', 'Create your first order to start tracking deadlines and payments.', '<button class="btn btn-primary" data-act="newOrder">+ New order</button>') });
  }
};

/* ---------- order detail ---------- */
Pages.order = {
  title: id => { const o = D.order(id); return o ? 'Order ' + o.number : 'Order'; }, nav: 'orders',
  render(id) {
    const o = D.order(id); if (!o) return `<div class="card">${UI.empty('Order not found', '', '<a class="btn" href="#/orders">Back to orders</a>')}</div>`;
    const bal = D.balance(o), paid = D.paid(id), pend = D.pendingAmt(id), cancelled = o.status === 'Cancelled', inv = D.invoiceFor(id);
    const pays = D.paymentsOfOrder(id).sort((a, b) => b.datetime.localeCompare(a.datetime)); const q = o.quoteId ? D.quote(o.quoteId) : null;
    const canPay = !cancelled, canRefund = paid > 0;
    return `<div class="toolbar"><a class="btn" href="#/orders">All orders</a><span class="grow"></span>
      ${cancelled ? '' : `<label class="small muted" for="stSel">Status</label><select id="stSel" data-change="orderStatus" data-id="${esc(id)}" style="width:auto">${F.opts(STATUSES.filter(s => s !== 'Cancelled'), o.status)}</select>`}
      <button class="btn" data-act="editOrder" data-id="${esc(id)}">Edit</button>
      ${canPay ? `<button class="btn btn-primary" data-act="newPayment" data-order="${esc(id)}" data-kind="payment">Record payment</button>` : ''}
      ${canRefund ? `<button class="btn" data-act="newPayment" data-order="${esc(id)}" data-kind="refund">Record refund</button>` : ''}
      ${D.canInvoice(o) ? `<button class="btn" data-act="showInvoice" data-id="${esc(id)}">${inv ? 'View invoice' : 'Create invoice'}</button>` : ''}
      <a class="btn" href="#/communication/${esc(o.customerId)}/${esc(id)}">WhatsApp message</a>
      ${cancelled ? '' : `<button class="btn" data-act="cancelOrder" data-id="${esc(id)}">Cancel order</button>`}<button class="btn" data-act="deleteOrder" data-id="${esc(id)}">Delete</button></div>
    <div class="grid2">
      <div class="card"><div class="card-head"><h2>${esc(o.number)}</h2><span>${UI.statusBadge(o.status)} ${UI.payBadge(D.invoiceStatus(o))} ${D.isOverdue(o) ? UI.badge('Past deadline', 'b-red') : ''}</span></div>
        <dl class="kv"><dt>Customer</dt><dd>${custLink(o.customerId)}</dd><dt>Order date</dt><dd>${esc(fmtDate(o.orderDate))}</dd><dt>Deadline</dt><dd>${dueCell(o)}</dd><dt>Completed</dt><dd>${esc(fmtDate(o.completedDate))}</dd><dt>Delivery method</dt><dd>${esc(o.deliveryMethod)}</dd><dt>Agreed scope</dt><dd>${esc(o.description)}</dd><dt>Internal notes</dt><dd>${esc(o.notes || '—')}</dd>${q ? `<dt>From quotation</dt><dd>${link('quotations', q.number)}</dd>` : ''}${inv ? `<dt>Invoice</dt><dd>${esc(inv.number)}, due ${esc(fmtDate(inv.dueDate))}</dd>` : ''}${cancelled ? `<dt>Cancelled</dt><dd>${esc(fmtDate(o.cancelledDate))}: ${esc(o.cancelReason)}</dd>` : ''}</dl></div>
      <div class="card"><h2>Money</h2>${Docs.linesTable(o.lines)}
        <dl class="kv"><dt>Subtotal</dt><dd class="num">${esc(money(D.subtotal(o)))}</dd><dt>Discount</dt><dd class="num">${esc(money(o.discount || 0))}</dd><dt>${cancelled ? 'Cancellation fee kept' : 'Agreed price'}</dt><dd class="num"><b>${esc(money(D.chargeable(o)))}</b></dd><dt>Deposit required</dt><dd class="num">${o.depositRequired ? esc(money(o.depositRequired)) : '—'}</dd><dt>Received (confirmed)</dt><dd class="num"><b style="color:var(--green)">${esc(money(paid))}</b></dd>${pend ? `<dt>Not yet confirmed</dt><dd class="num"><span class="badge b-amber">${esc(money(pend))}</span> not counted</dd>` : ''}<dt>${bal < 0 ? 'Refund due to customer' : 'Remaining balance'}</dt><dd class="num"><b style="color:${bal > 0 ? 'var(--red)' : 'var(--text)'}">${esc(money(Math.abs(bal)))}</b></dd></dl>${cancelled && bal < 0 ? `<div class="notice warn">${esc(money(-bal))} is still owed back to the customer. Use Record refund once you have paid it.</div>` : ''}</div>
    </div>
    <div class="card"><h2>Payments on this order</h2>${this.paymentsTable(pays)}</div>
    <div class="grid2">
      <div class="card"><h2>Delivery</h2>
        <form class="form" data-form="delivery" data-id="${esc(id)}" novalidate>${F.select('deliveryStatus', 'Delivery status', DELIVERY_STATUS, o.deliveryStatus)}${F.area('deliveryNotes', 'Delivery notes', o.deliveryNotes, { rows: 2 })}<div><button class="btn btn-sm" type="submit">Save delivery</button></div></form>
        <h3>Deliverable files and links</h3>
        <div class="notice info">KDSMS does <b>not</b> upload or store files. It only records the file names and links you type. Keep the real files in a folder on your computer or in cloud storage, and avoid keeping customers' sensitive documents longer than needed.</div>
        ${o.files.length ? UI.table(['File', 'Description', 'Link or location', ''], o.files.map((f, i) => `<tr><td>${esc(f.name)}<div class="muted small">${esc(fmtDate(f.addedAt))}</div></td><td>${esc(f.description || '—')}</td><td>${/^https?:\/\//i.test(f.link) ? `<a href="${esc(f.link)}" target="_blank" rel="noopener noreferrer">Open link</a>` : `<span class="mono">${esc(f.link || '—')}</span>`}</td><td><button class="btn btn-sm" data-act="removeFile" data-id="${esc(id)}" data-idx="${i}">Remove</button></td></tr>`)) : '<p class="muted small">No files recorded yet.</p>'}
        <div><button class="btn btn-sm" data-act="addFile" data-id="${esc(id)}">+ Add file or link</button></div></div>
      <div class="card"><h2>Revisions (${o.revisions.length})</h2>${o.revisions.length ? `<ul class="feed">${o.revisions.map((r, i) => `<li><span><b>#${i + 1}</b> ${esc(r.note)}</span><span class="muted nowrap">${esc(fmtDate(r.date))}</span></li>`).join('')}</ul>` : '<p class="muted small">No revisions requested.</p>'}
        <form class="form" data-form="revision" data-id="${esc(id)}" novalidate>${F.text('note', 'Add revision note', '', { ph: 'e.g. Customer wants a different photo', attrs: 'maxlength="500"' })}<div><button class="btn btn-sm" type="submit">Add revision</button></div></form></div>
    </div>`;
  },
  paymentsTable(pays) {
    return UI.table(['Date', 'Transaction', 'Type', 'Method', 'Reference', { t: 'Amount', r: 1 }, 'Status', ''], pays.map(p => `<tr><td class="nowrap">${esc(fmtDateTime(p.datetime))}</td><td class="mono">${esc(p.id)}</td><td>${p.kind === 'refund' ? 'Refund' : 'Payment'}</td><td>${esc(p.method)}</td><td class="mono">${esc(p.reference || '—')}</td><td class="r num">${p.kind === 'refund' ? '-' : ''}${esc(money(p.amount))}</td><td>${paymentBadge(p)}</td><td class="nowrap">${paymentButtons(p)}</td></tr>`), { empty: UI.empty('No payments recorded', 'Record a deposit or payment when money arrives.') });
  }
};
const paymentBadge = p => p.voided ? `${UI.badge('Voided', 'b-grey')}<div class="muted small">${esc(p.voidReason)}</div>` : p.verified ? UI.badge(p.kind === 'refund' ? 'Refund paid' : 'Received', 'b-green') : UI.badge('Not confirmed', 'b-amber');
const paymentButtons = p => p.voided ? '' : [!p.verified ? `<button class="btn btn-sm btn-primary" data-act="confirmPayment" data-id="${esc(p.id)}">Confirm received</button>` : '', p.verified && p.kind === 'payment' ? `<button class="btn btn-sm" data-act="showReceipt" data-id="${esc(p.id)}">Receipt</button>` : '', `<button class="btn btn-sm" data-act="voidPayment" data-id="${esc(p.id)}">Void</button>`].join(' ');

document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.change) return; const fn = Actions[t.dataset.change]; if (fn) fn(t.dataset, t, e);
});
Actions.orderStatus = (ds, el) => {
  const r = D.setOrderStatus(ds.id, el.value); if (!r.ok) { UI.toast(r.error, 'err'); return UI.refresh(); }
  const o = D.order(ds.id); UI.toast(`Status changed to ${o.status}.`, 'ok');
  if (o.status === 'Completed' && D.balance(o) > 0) UI.toast(`Completed, but ${money(D.balance(o))} is still unpaid.`);
  UI.refresh();
};
Actions.cancelOrder = ds => {
  const o = D.order(ds.id); if (!o) return; const paid = D.paid(o.id);
  UI.modal({ title: `Cancel order ${o.number}`, body: `<form id="mform" class="form" data-form="cancel" data-id="${esc(o.id)}" novalidate>${F.top()}<div class="notice warn">Cancelling stops the order from counting as revenue. Money already received: <b>${esc(money(paid))}</b>.</div>${F.text('fee', 'Cancellation fee you keep (KSh)', 0, { type: 'number', attrs: 'min="0" step="1"', hint: 'Only money you actually received can be kept. The fee counts as revenue. The rest is owed back to the customer; record that as a refund after paying it.' })}${F.area('reason', 'Reason for cancelling', '', { req: 1, rows: 2 })}</form>`, footer: '<button class="btn" type="button" data-act="closeModal">Keep order</button><button class="btn btn-danger" type="submit" form="mform">Cancel this order</button>' });
};
Forms.cancel = form => {
  const r = D.cancelOrder(form.dataset.id, UI.readForm(form)); if (!r.ok) return UI.showErrors(form, r.errors);
  UI.closeModal(); UI.toast(r.refundDue > 0 ? `Order cancelled. ${money(r.refundDue)} is due back to the customer.` : 'Order cancelled.', r.refundDue > 0 ? 'err' : 'ok'); UI.refresh();
};
Actions.deleteOrder = async ds => {
  const o = D.order(ds.id); if (!o) return;
  if (!(await UI.confirm({ title: 'Delete order?', html: `Delete <b>${esc(o.number)}</b>? Only orders with no payments or invoices can be deleted. Otherwise use Cancel order.`, confirmText: 'Delete order', danger: true }))) return;
  const r = D.removeOrder(ds.id); if (!r.ok) return UI.toast(r.error, 'err'); UI.toast('Order deleted.'); UI.go('orders');
};
Forms.delivery = form => { D.orderSetDelivery(form.dataset.id, UI.readForm(form)); UI.toast('Delivery saved.', 'ok'); UI.refresh(); };
Forms.revision = form => { const r = D.orderAddRevision(form.dataset.id, UI.readForm(form).note); if (!r.ok) return UI.showErrors(form, { note: r.error }); UI.toast('Revision added.', 'ok'); UI.refresh(); };
Actions.addFile = ds => UI.modal({ title: 'Add file or link', body: `<form id="mform" class="form" data-form="file" data-id="${esc(ds.id)}" novalidate>${F.top()}${F.text('name', 'File name', '', { req: 1, ph: 'e.g. Asha-CV-final.pdf', attrs: 'maxlength="150"' })}${F.text('description', 'Description (optional)', '')}${F.text('link', 'Link or folder path (optional)', '', { ph: 'https://drive.google.com/... or C:\\Karani\\Orders\\...', hint: 'Only the text is saved. The file itself is not uploaded.' })}</form>`, footer: '<button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn btn-primary" type="submit" form="mform">Save</button>' });
Forms.file = form => { const r = D.orderAddFile(form.dataset.id, UI.readForm(form)); if (!r.ok) return UI.showErrors(form, r.errors); UI.closeModal(); UI.toast('File recorded.', 'ok'); UI.refresh(); };
Actions.removeFile = async ds => { if (await UI.confirm({ title: 'Remove file record?', message: 'This removes only the note in KDSMS, not the actual file.', confirmText: 'Remove', danger: true })) { D.orderRemoveFile(ds.id, Number(ds.idx)); UI.refresh(); } };

/* ---------- payments ---------- */
const paymentForm = (orderId, kind) => {
  const orders = D.db.orders.filter(o => kind === 'refund' ? D.paid(o.id) > 0 : o.status !== 'Cancelled').sort((a, b) => b.orderDate.localeCompare(a.orderDate));
  const sel = D.order(orderId); const def = sel ? (kind === 'refund' ? Math.min(D.paid(sel.id), Math.max(0, -D.balance(sel)) || D.paid(sel.id)) : Math.max(0, D.balance(sel))) : '';
  return `<form id="mform" class="form" data-form="payment" novalidate><input type="hidden" name="kind" value="${esc(kind)}">${F.top()}
  ${kind === 'refund' ? '<div class="notice info">A refund is money you pay back to a customer. It reduces your cash received.</div>' : ''}
  ${F.select('orderId', 'Order', orders.map(o => [o.id, `${o.number}: ${D.customerName(o.customerId)} (balance ${money(Math.max(0, D.balance(o)))})`]), orderId || '', { blank: 'Choose an order', req: 1 })}
  <div class="row2">${F.text('amount', 'Amount (KSh)', def === '' ? '' : def, { req: 1, type: 'number', attrs: 'min="1" step="1"' })}${F.text('datetime', 'Date and time', nowStr(), { req: 1, type: 'datetime-local' })}</div>
  <div class="row2">${F.select('method', 'Method', METHODS, 'M-Pesa', { req: 1 })}${F.text('reference', 'Reference (M-Pesa code, bank ref)', '', { attrs: 'maxlength="60"', hint: 'Typing a reference does not confirm anything.' })}</div>
  ${F.area('notes', 'Notes', '', { rows: 2 })}
  ${F.check('verified', kind === 'refund' ? '<b>I have paid this refund out.</b>' : '<b>I have checked and confirmed this money was received.</b>', false, kind === 'refund' ? 'Leave unticked to save it as not confirmed.' : 'Check your M-Pesa message or statement, bank record or cash in hand first. Unticked payments are saved as "Not confirmed" and are NOT counted as money received.')}</form>`;
};
Actions.newPayment = ds => UI.modal({ title: ds.kind === 'refund' ? 'Record refund' : 'Record payment', body: paymentForm(ds.order || '', ds.kind || 'payment'), footer: '<button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn btn-primary" type="submit" form="mform">Save</button>' });
Actions.newPaymentGeneral = () => Actions.newPayment({ order: '', kind: 'payment' });
Forms.payment = async form => {
  const v = UI.readForm(form); const chk = D.validatePayment(v); if (Object.keys(chk.errs).length) return UI.showErrors(form, chk.errs);
  const o = chk.o;
  if (chk.kind === 'payment' && v.verified && chk.amount > Math.max(0, D.balance(o))) { if (!(await UI.confirm({ title: 'More than the balance?', message: `This is ${money(chk.amount)} but the remaining balance is only ${money(Math.max(0, D.balance(o)))}. The order will show as overpaid.`, confirmText: 'Record anyway' }))) return; }
  if (D.possibleDuplicate(chk)) { if (!(await UI.confirm({ title: 'Possible duplicate', message: 'A payment with the same order, amount, method and date already exists. Record this one as well?', confirmText: 'It is a different payment' }))) return; }
  const r = D.addPayment(v); if (!r.ok) return UI.showErrors(form, r.errors);
  UI.closeModal(); const p = r.record;
  UI.toast(p.verified ? (p.kind === 'refund' ? 'Refund recorded.' : 'Payment recorded and counted as received.') : 'Saved as NOT confirmed. It is not counted until you confirm it.', p.verified ? 'ok' : '');
  if (r.advanced) UI.toast(`Order ${o.number} moved to Confirmed.`); UI.refresh();
};
Actions.confirmPayment = async ds => {
  const p = D.payment(ds.id); if (!p) return;
  if (!(await UI.confirm({ title: 'Confirm money received?', html: `Confirm that <b>${esc(money(p.amount))}</b> (${esc(p.method)}${p.reference ? ', ref ' + esc(p.reference) : ''}) was really ${p.kind === 'refund' ? 'paid out' : 'received'}? It will then count in your totals.`, confirmText: 'Yes, confirmed' }))) return;
  const r = D.confirmPayment(ds.id); if (r.ok) { UI.toast('Payment confirmed.', 'ok'); if (r.advanced) UI.toast('Order moved to Confirmed.'); UI.refresh(); }
};
Actions.voidPayment = ds => { const p = D.payment(ds.id); if (!p) return; UI.modal({ title: `Void ${p.id}`, body: `<form id="mform" class="form" data-form="void" data-id="${esc(p.id)}" novalidate>${F.top()}<div class="notice warn">Payments are never deleted. Voiding keeps the record but removes ${esc(money(p.amount))} from your totals. Use it for mistakes or payments that bounced.</div>${F.text('reason', 'Reason', '', { req: 1, attrs: 'maxlength="300"' })}</form>`, footer: '<button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn btn-danger" type="submit" form="mform">Void payment</button>' }); };
Forms.void = form => { const r = D.voidPayment(form.dataset.id, UI.readForm(form).reason); if (!r.ok) return UI.showErrors(form, { reason: r.error }); UI.closeModal(); UI.toast('Payment voided.'); UI.refresh(); };
Actions.showReceipt = ds => { const p = D.payment(ds.id); if (p) UI.showDoc('Receipt ' + p.receiptNo, Docs.receipt(p)); };
Actions.showInvoice = ds => { const o = D.order(ds.id); if (o) { const html = Docs.invoice(o); UI.showDoc('Invoice ' + D.invoiceFor(o.id).number, html); UI.refresh(); } };

Pages.payments = {
  title: 'Payments and invoices', nav: 'payments',
  render() {
    const f = UI.f.payments;
    return `<div class="toolbar"><div class="tabs grow" role="tablist"><button class="tab ${f.tab === 'transactions' ? 'active' : ''}" role="tab" data-act="payTab" data-tab="transactions">Transactions</button><button class="tab ${f.tab === 'invoices' ? 'active' : ''}" role="tab" data-act="payTab" data-tab="invoices">Invoices</button></div><button class="btn btn-primary" data-act="newPaymentGeneral">+ Record payment</button></div>
    <div class="toolbar"><input class="grow" type="text" placeholder="${f.tab === 'invoices' ? 'Search order, invoice or customer' : 'Search customer, order or reference'}" value="${esc(f.q)}" data-filter="payments.q" aria-label="Search"><select data-filter="payments.status" aria-label="Filter by status" style="width:auto">${f.tab === 'invoices' ? F.opts([['', 'All invoice statuses'], 'Paid', 'Partially paid', 'Unpaid', 'Overdue'], f.status) : F.opts([['', 'All statuses'], ['received', 'Received'], ['unconfirmed', 'Not confirmed'], ['voided', 'Voided']], f.status)}</select>${f.tab === 'transactions' ? `<select data-filter="payments.method" aria-label="Filter by method" style="width:auto"><option value="">All methods</option>${F.opts(METHODS, f.method)}</select>` : ''}</div>

      return UI.table(['Invoice', 'Order', 'Customer', 'Due', { t: 'Total', r: 1 }, { t: 'Paid', r: 1 }, { t: 'Balance', r: 1 }, 'Status', ''], rows.map(o => { const inv = D.invoiceFor(o.id); return `<tr><td>${inv ? `<span class="mono">${esc(inv.number)}</span>` : '<span class="muted">Not created</span>'}</td><td>${ordLink(o)}</td><td>${custLink(o.customerId)}</td><td class="nowrap">${esc(fmtDate(D.dueDate(o)))}</td><td class="r num">${esc(money(D.chargeable(o)))}</td><td class="r num">${esc(money(D.paid(o.id)))}</td><td class="r num">${esc(money(Math.max(0, D.balance(o))))}</td><td>${UI.payBadge(D.invoiceStatus(o))}</td><td><button class="btn btn-sm" data-act="showInvoice" data-id="${esc(o.id)}">${inv ? 'View / print' : 'Create'}</button></td></tr>`; }), { empty: UI.empty('No invoices to show', 'Invoices can be created for confirmed orders, from the order page or here.') });
    }
    const rows = D.db.payments.filter(p => {

      const o = D.order(p.orderId); return !q || D.customerName(p.customerId).toLowerCase().includes(q) || (o && o.number.toLowerCase().includes(q)) || p.reference.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
    }).sort((a, b) => b.datetime.localeCompare(a.datetime));
    return UI.table(['Date', 'Transaction', 'Customer', 'Order', 'Method', 'Reference', { t: 'Amount', r: 1 }, 'Status', ''], rows.map(p => { const o = D.order(p.orderId); return `<tr><td class="nowrap">${esc(fmtDateTime(p.datetime))}</td><td class="mono">${esc(p.id)}${p.kind === 'refund' ? '<div class="muted small">refund</div>' : ''}</td><td>${custLink(p.customerId)}</td><td>${o ? ordLink(o) : '—'}</td><td>${esc(p.method)}</td><td class="mono">${esc(p.reference || '—')}</td><td class="r num">${p.kind === 'refund' ? '-' : ''}${esc(money(p.amount))}</td><td>${paymentBadge(p)}</td><td class="nowrap">${paymentButtons(p)}</td></tr>`; }), { empty: D.db.payments.length ? UI.empty('No payments match', 'Change the search or filters.') : UI.empty('No payments yet', 'Record a payment from an order, or use the button above.', '<button class="btn btn-primary" data-act="newPaymentGeneral">+ Record payment</button>') });

};

/* ---------- reports ---------- */
const Reports = {
  state: null,
  init() { if (!this.state) { const T = todayStr(); this.state = { preset: 'month', from: monthStart(T), to: monthEnd(T), gran: 'month' }; } },
  setPreset(p) {
    const T = todayStr(), s = this.state; s.preset = p;
    if (p === 'today') { s.from = s.to = T; s.gran = 'day'; }
    else if (p === 'week') { s.from = weekStart(T); s.to = addDays(weekStart(T), 6); s.gran = 'day'; }
    else if (p === 'month') { s.from = monthStart(T); s.to = monthEnd(T); s.gran = 'day'; }
    else if (p === 'year') { s.from = T.slice(0, 4) + '-01-01'; s.to = T.slice(0, 4) + '-12-31'; s.gran = 'month'; }
    else if (p === '30') { s.from = addDays(T, -29); s.to = T; s.gran = 'day'; }
  },
  pk(date, g) { return g === 'day' ? date : g === 'week' ? weekStart(date) : g === 'month' ? date.slice(0, 7) : date.slice(0, 4); },
  plabel(k, g) { return g === 'day' ? fmtDate(k) : g === 'week' ? 'Week of ' + fmtDate(k) : g === 'month' ? monthLabel(k) : k; },
  build(from, to, gran) {
    const R = D.revenueEvents().filter(e => D.inRange(e.date, from, to)), C = D.cashEvents().filter(e => D.inRange(e.date, from, to)), X = D.db.expenses.filter(e => D.inRange(e.date, from, to));
    const earned = sum(R, e => e.amount), cash = sum(C, e => e.amount), exp = sum(X, e => e.amount), outstanding = D.totalOutstanding();
    const sec = {};
    sec.summary = { title: 'Summary', types: ['t', 'm', 't'], headers: ['Measure', 'Amount', 'How it is worked out'], rows: [
      ['Revenue earned', earned, 'Completed orders in the period (by completion date) plus cancellation fees kept'],
      ['Payments received (net)', cash, 'Confirmed payments minus confirmed refunds in the period'],
      ['Operating expenses', exp, 'Business expenses only. Owner withdrawals are excluded'],
      ['Estimated operating profit', earned - exp, 'Revenue earned minus operating expenses. Not final net profit'],
      ['Cash left from operations', cash - exp, 'Payments received (net) minus operating expenses'],
      ['Outstanding balances (today)', outstanding, 'Unpaid amounts on confirmed work, as of today, not limited to the period'],
      ['Owner withdrawals (not an expense)', sum(D.db.equity.filter(e => e.type === 'Owner withdrawal' && D.inRange(e.date, from, to)), e => e.amount), 'Shown for information only']
    ] };
    const keys = uniq([...R.map(e => this.pk(e.date, gran)), ...C.map(e => this.pk(e.date, gran)), ...X.map(e => this.pk(e.date, gran))]).sort();
    sec.sales = { title: { day: 'Daily', week: 'Weekly', month: 'Monthly', year: 'Annual' }[gran] + ' sales', types: ['t', 'n', 'm', 'm', 'm'], headers: ['Period', 'Orders completed', 'Revenue earned', 'Payments received', 'Expenses'], rows: keys.map(k => [this.plabel(k, gran), R.filter(e => !e.cancelled && this.pk(e.date, gran) === k).length, sum(R.filter(e => this.pk(e.date, gran) === k), e => e.amount), sum(C.filter(e => this.pk(e.date, gran) === k), e => e.amount), sum(X.filter(e => this.pk(e.date, gran) === k), e => e.amount)]), total: true };
    const bySvc = {}; let gross = 0, disc = 0, fees = 0;

Forms.unlock = form => Actions.restoreCheck(null, null, UI.readForm(form).pass);
Forms.restore = form => {
  if (!Rst.result) return UI.showErrors(form, { _form: 'Choose and check a backup file first.' });
  if (UI.readForm(form).word.trim() !== 'RESTORE') return UI.showErrors(form, { word: 'Type RESTORE exactly to continue.' });
  Backup.restore(Rst.result.obj); Rst.result = null; Rst.text = ''; UI.toast('Backup restored.', 'ok'); UI.refresh();
};
Actions.undoRestore = async () => { if (await UI.confirm({ title: 'Undo the last restore?', message: 'Your data goes back to how it was just before the restore.', confirmText: 'Undo restore', danger: true })) { Backup.undoRestore(); UI.toast('Restore undone.'); UI.refresh(); } };
Actions.csvTable = ds => {
  const db = D.db; let h, rows;
  if (ds.t === 'customers') { h = ['ID', 'Name', 'Phone', 'Email', 'Category', 'Registered', 'Notes']; rows = db.customers.map(c => [c.id, c.name, c.phone, c.email, c.category, c.registered, c.notes]); }
  else if (ds.t === 'orders') { h = ['Order', 'Customer', 'Status', 'Order date', 'Deadline', 'Completed', 'Subtotal', 'Discount', 'Agreed price', 'Paid', 'Balance', 'Services']; rows = db.orders.map(o => [o.number, D.customerName(o.customerId), o.status, o.orderDate, o.deadline, o.completedDate, D.subtotal(o), o.discount || 0, D.chargeable(o), D.paid(o.id), D.balance(o), o.lines.map(l => l.name).join('; ')]); }
  else if (ds.t === 'payments') { h = ['Transaction', 'Order', 'Customer', 'Type', 'Date time', 'Method', 'Reference', 'Amount', 'Confirmed', 'Voided', 'Receipt']; rows = db.payments.map(p => [p.id, (D.order(p.orderId) || {}).number || '', D.customerName(p.customerId), p.kind, p.datetime, p.method, p.reference, p.amount, p.verified ? 'yes' : 'no', p.voided ? 'yes' : 'no', p.receiptNo]); }
  else if (ds.t === 'expenses') { h = ['ID', 'Date', 'Category', 'Description', 'Method', 'Reference', 'Amount', 'Notes']; rows = db.expenses.map(e => [e.id, e.date, e.category, e.description, e.method, e.reference, e.amount, e.notes]); }
  else { h = ['Number', 'Customer', 'Date', 'Valid until', 'Status', 'Total']; rows = db.quotations.map(q => [q.number, D.customerName(q.customerId), q.date, q.validUntil, D.effectiveQuoteStatus(q), D.quoteTotal(q)]); }
  Files.download(`karani-${ds.t}-${todayStr()}.csv`, Files.csv(h, rows), 'text/csv;charset=utf-8'); UI.toast('CSV downloaded.', 'ok');
};

/* ---------- settings ---------- */
Pages.settings = {
  title: 'Settings',
  render() {
    const s = D.db.settings;
    return `<form class="form" data-form="settings" novalidate>${F.top()}
    <div class="card"><h2>Business details</h2><div class="row2">${F.text('businessName', 'Business name', s.businessName, { req: 1 })}${F.text('ownerName', 'Owner name', s.ownerName)}</div><div class="row2">${F.text('phone', 'Business telephone (WhatsApp)', s.phone ? Phone.display(s.phone) : '', { type: 'tel', ph: '0712 345 678' })}${F.text('email', 'Business email', s.email, { type: 'email' })}</div>${F.text('location', 'Physical or service location', s.location)}${F.area('description', 'Business description', s.description, { rows: 2 })}
      <div class="field"><span class="lbl">Business logo</span><div class="toolbar"><span id="logoPrev">${s.logo ? `<img src="${esc(s.logo)}" alt="Current logo" style="width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:6px">` : '<span class="muted small">No custom logo. The default Karani logo is used.</span>'}</span><input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" data-change="logoPick" style="width:auto"><button class="btn btn-sm" type="button" data-act="logoClear">Use default logo</button></div><input type="hidden" name="logo" value="${esc(s.logo)}"><div class="hint">PNG, JPG or WebP. It is resized and stored inside the data.</div></div>
      <div class="row2"><div class="field"><label for="cur">Currency</label><input id="cur" type="text" value="Kenyan Shilling (KSh)" disabled><div class="hint">Fixed in this version. Whole shillings only.</div></div></div></div>
    <div class="card"><h2>Documents and numbering</h2><div class="row2">${F.text('orderFormat', 'Order number format', s.orderFormat, { hint: 'Use {NNNN} for the running number and {YYYY} for the year.' })}${F.text('invoiceFormat', 'Invoice number format', s.invoiceFormat)}${F.text('receiptFormat', 'Receipt number format', s.receiptFormat)}${F.text('quotationFormat', 'Quotation number format', s.quotationFormat)}</div><div class="row2">${F.text('quoteValidityDays', 'Default quotation validity (days)', s.quoteValidityDays, { type: 'number', attrs: 'min="1"' })}${F.text('paymentTermsDays', 'Invoice due after (days)', s.paymentTermsDays, { type: 'number', attrs: 'min="0"' })}</div>${F.area('paymentTerms', 'Default payment terms (printed on invoices and quotations)', s.paymentTerms, { rows: 2 })}${F.area('paymentInstructions', 'How customers pay (printed on documents)', s.paymentInstructions, { rows: 2, ph: 'e.g. M-Pesa Send Money to 07XX XXX XXX (Your Name)', hint: 'Only enter details you are happy to show customers.' })}<p class="muted small">Changing a format affects new numbers only. Existing numbers never change.</p></div>
    <div class="card"><h2>Registration and tax details (optional)</h2><div class="notice info">Leave these blank unless you really have them. Nothing is filled in for you, and they only print on documents when entered.</div><div class="row2">${F.text('regNo', 'Business registration number', s.regNo)}${F.text('taxPin', 'KRA PIN', s.taxPin)}</div></div>
    <div class="card"><h2>Security</h2>${F.text('sessionTimeoutMin', 'Sign out after inactivity (minutes, 0 = never)', s.sessionTimeoutMin, { type: 'number', attrs: 'min="0" max="480"' })}<div><button class="btn" type="button" data-act="changePassword">Change password</button></div></div>
    <div><button class="btn btn-primary" type="submit">Save settings</button></div></form>
    <div class="card"><h2>Sample data</h2>${Sample.hasAny() ? '<div class="notice warn">Sample (fictional) records are in your data. Remove them before real use so they do not mix with real figures.</div><div><button class="btn btn-danger" data-act="removeSample">Remove all sample data</button></div>' : '<p class="muted">No sample data present.</p><div><button class="btn" data-act="loadSample">Load sample data</button></div>'}</div>
    <div class="card"><h2>Danger zone</h2><p class="muted small">Erases everything stored by this app in this browser, including your account. Make a backup first.</p><div><button class="btn btn-danger" data-act="eraseAll">Erase all app data</button></div></div>`;
  }
};
Forms.settings = form => {
  const v = UI.readForm(form); const r = D.saveSettings(v); if (!r.ok) return UI.showErrors(form, r.errors);
  UI.toast('Settings saved.', 'ok'); UI.drawShell(); UI.render();
};
Actions.logoPick = (ds, el) => {
  const f = el.files && el.files[0]; if (!f) return; if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return UI.toast('Choose a PNG, JPG or WebP image.', 'err'); if (f.size > 3 * 1024 * 1024) return UI.toast('That image is over 3 MB. Choose a smaller one.', 'err');
  const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => { const max = 256, sc = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc)); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); const url = cv.toDataURL('image/png'); document.querySelector('input[name=logo]').value = url; document.getElementById('logoPrev').innerHTML = `<img src="${url}" alt="New logo preview" style="width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:6px">`; UI.toast('Logo ready. Press Save settings.'); }; img.onerror = () => UI.toast('That image could not be read.', 'err'); img.src = String(rd.result); }; rd.readAsDataURL(f);
};
Actions.logoClear = () => { document.querySelector('input[name=logo]').value = ''; document.getElementById('logoPrev').innerHTML = '<span class="muted small">Default logo will be used. Press Save settings.</span>'; };
Actions.removeSample = async () => { if (await UI.confirm({ title: 'Remove all sample data?', html: 'This deletes every record marked as sample: customers, orders, payments, quotations, expenses. Your own records are kept.', confirmText: 'Remove sample data', danger: true })) { const r = Sample.remove(); UI.toast(`Sample data removed (${r.removed} records).`, 'ok'); UI.refresh(); } };
Actions.changePassword = () => UI.modal({ title: 'Change password', body: `<form id="mform" class="form" data-form="password" novalidate>${F.top()}${F.text('cur', 'Current password', '', { type: 'password', req: 1, attrs: 'autocomplete="current-password"' })}${F.text('next', 'New password', '', { type: 'password', req: 1, attrs: 'autocomplete="new-password"', hint: 'At least 8 characters with letters and a number.' })}${F.text('next2', 'Repeat new password', '', { type: 'password', req: 1, attrs: 'autocomplete="new-password"' })}</form>`, footer: '<button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn btn-primary" type="submit" form="mform">Change password</button>' });
Forms.password = async form => { const v = UI.readForm(form); if (v.next !== v.next2) return UI.showErrors(form, { next2: 'The passwords do not match.' }); const r = await Auth.changePassword(v.cur, v.next); if (!r.ok) return UI.showErrors(form, { _form: r.error }); UI.closeModal(); UI.toast('Password changed.', 'ok'); };

/* ---------- activity log ---------- */
Pages.activity = {
  title: 'Activity log',
  render() { return `<div class="toolbar"><input class="grow" type="text" placeholder="Search the log" value="${esc(UI.f.activity.q)}" data-filter="activity.q" aria-label="Search log"><button class="btn" data-act="csvAudit">Download CSV</button></div><div class="explain">Records important changes to orders, payments, expenses and settings. It is stored with your data, so it helps you spot mistakes, but it is <b>not tamper-proof</b>: someone with access to this browser could edit it.</div><div id="list">${this.list()}</div>`; },
  list() { const q = UI.f.activity.q.trim().toLowerCase(); const rows = D.db.audit.slice().reverse().filter(a => !q || `${a.action} ${a.entity} ${a.entityId} ${a.detail} ${a.by}`.toLowerCase().includes(q)).slice(0, 300); return UI.table(['When', 'User', 'Action', 'Record', 'Details'], rows.map(a => `<tr><td class="nowrap">${esc(fmtDateTime(a.ts))}</td><td>${esc(a.by)}</td><td>${UI.badge(a.action, 'b-grey')}</td><td class="mono">${esc(a.entity)} ${esc(a.entityId)}</td><td>${esc(a.detail)}</td></tr>`), { empty: UI.empty('No activity recorded', '') }); }
};
Actions.csvAudit = () => Files.download(`karani-activity-log-${todayStr()}.csv`, Files.csv(['When', 'User', 'Action', 'Record type', 'Record ID', 'Details'], D.db.audit.map(a => [a.ts, a.by, a.action, a.entity, a.entityId, a.detail])), 'text/csv;charset=utf-8');

/* ---------- help ---------- */
Pages.help = {
  title: 'Help and guide',
  render() {
    const item = (t, d) => `<div class="card"><h3>${esc(t)}</h3><p>${d}</p></div>`;
    return `<div class="explain">Quick guide to each part of the system. Everything here works without internet.</div><div class="grid">
    ${item('Dashboard', 'A live summary of customers, orders, money and deadlines. Every number is calculated from your records.')}
    ${item('Customers', 'Add each customer once. Open a profile to see their orders and payments. Phone numbers are used to open WhatsApp.')}
    ${item('Services', 'Your price list. Prices are starting points and can be changed per order.')}
    ${item('Orders', 'One order per job. Move it through the statuses as work progresses. Overdue and due-soon orders are flagged.')}
    ${item('Quotations', 'Send a price first. When accepted, convert it to an order in one click. The same customer record is reused.')}
    ${item('Payments and invoices', 'Record every payment, then tick <b>confirmed</b> only after checking your M-Pesa, bank or cash. Receipts are only available for confirmed payments. Print and choose "Save as PDF" for a PDF.')}
    ${item('Expenses', 'Record business costs. Record your own withdrawals separately so profit stays honest.')}
    ${item('Reports', 'Pick a period, review the tables, print the page or download each table as CSV.')}
    ${item('Communication', 'Fill a message template, check it, and open it in WhatsApp. You press Send yourself.')}
    ${item('Backup and restore', 'Download a backup file regularly and keep copies elsewhere. Restore only from files you trust.')}</div>`;
  }
};

</script>
